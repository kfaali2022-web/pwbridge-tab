name: release

# Produces the distributable EXE. The GitHub release is always created as a
# draft: publishing is a deliberate human step.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0 or 0.2.0-alpha.2'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          Import-Module ./server/modules/PwBridge.Common.psm1 -Force
          # A prerelease tag (v0.2.0-alpha.2) still has to build the version the
          # code declares; only the label after the hyphen may differ.
          $parts = Split-PwBridgeVersion -Version $version
          $declared = Get-PwBridgeVersion
          if ($declared -ne $parts.Base) {
            throw "Tag base version $($parts.Base) does not match Get-PwBridgeVersion ($declared). Bump PwBridge.Common.psm1 first."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($parts.IsPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -Scope CurrentUser
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Validate
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

      - name: Ensure Inno Setup
        shell: powershell
        run: ./installer/Ensure-InnoSetup.ps1 -Install

      - name: Build installer
        shell: powershell
        run: ./installer/build.ps1 -Version ${{ steps.version.outputs.version }} -SkipValidation

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ASCII
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pwbridge-tab-${{ steps.version.outputs.version }}-setup
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          tag_name: v${{ steps.version.outputs.version }}
          name: pwbridge-tab ${{ steps.version.outputs.version }}
          body: |
            Download `pwbridge-tab-${{ steps.version.outputs.version }}-setup.exe` and run it. No administrator rights are required.

            Verify the download before running it:

            ```powershell
            Get-FileHash .\pwbridge-tab-${{ steps.version.outputs.version }}-setup.exe -Algorithm SHA256
            ```

            and compare against `SHA256SUMS.txt`.

            The installer is not code-signed, so SmartScreen will warn on first run. See `docs/TESTER-GUIDE.md`.
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
